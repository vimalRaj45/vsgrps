    * { margin: 0; padding: 0; box-sizing: border-box; }

      color: var(--text);

      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;

    /* Noise texture overlay */
    body::before {
      content: '';

      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* Grid background */
    .grid-bg {
      background-image: 
        linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      opacity: 0.5;

    .glass {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--accent), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-blue));
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;

      const project = projectsData[projectId];

        document.getElementById('p-title').innerText = project.title;
        document.getElementById('p-category').innerText = project.category;
        document.getElementById('p-desc').innerText = project.desc;
        document.getElementById('p-industry').innerText = project.industry;
        document.getElementById('p-tech').innerText = project.tech;
        document.getElementById('p-long-desc').innerText = project.longDesc;
        
        if (project.liveUrl) {
          const topBtn = document.getElementById('p-live-btn-top');
          const bottomBtn = document.getElementById('p-live-btn-bottom');
          if (topBtn) {
            topBtn.href = project.liveUrl;
            topBtn.style.display = 'inline-flex';
          }
          if (bottomBtn) {
            bottomBtn.href = project.liveUrl;
            bottomBtn.style.display = 'inline-flex';
          }
        }

        const featureList = document.getElementById('p-features');
        project.features.forEach(feature => {
          const li = document.createElement('li');
          li.className = 'card p-4 flex items-center gap-3 text-muted';
          li.innerHTML = `<i class="bi bi-check2-circle text-accent"></i> ${feature}`;
          featureList.appendChild(li);
        });

        document.getElementById('project-loading').classList.add('hidden');
        document.getElementById('project-content').classList.remove('hidden');
      } else {
        document.getElementById('project-loading').innerHTML = '<p class="text-red-500">Project not found.</p>';
      }

    // Theme Logic
    const themeToggle = document.getElementById('theme-toggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('vsgrps_theme') || 'dark';
    
    html.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('vsgrps_theme', newTheme);
      updateThemeIcon(newTheme);
    });

    function updateThemeIcon(theme) {
      const icon = themeToggle.querySelector('i');
      const navLogo = document.getElementById('nav-logo');
      
      if (navLogo) navLogo.classList.add('logo-fade');

      setTimeout(() => {
        const isWebp = true; // Set to true once images are converted
        const ext = isWebp ? 'webp' : 'jpeg';
        const suffix = theme === 'dark' ? 'dark_banner' : 'light_banner';
        
        if (navLogo) {
          navLogo.src = `assets/vsgrps_navbar_${suffix}.${ext}`;
        }

        if (theme === 'dark') {
          icon.className = 'bi bi-sun';
        } else {
          icon.className = 'bi bi-moon-stars';
        }

        setTimeout(() => {
          if (navLogo) navLogo.classList.remove('logo-fade');
        }, 50);
      }, 150);
    }

    // Particle System
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initParticles() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for(let i=0; i<50; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random()-0.5)*0.5,
          vy: (Math.random()-0.5)*0.5,
          size: Math.random()*2
        });
      }
    }

    function animate() {
      ctx.clearRect(0,0,canvas.width, canvas.height);
      const isDark = html.getAttribute('data-theme') === 'dark';
      ctx.fillStyle = isDark ? 'rgba(59,130,246,0.3)' : 'rgba(37,99,235,0.3)';
      
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if(p.x<0 || p.x>canvas.width) p.vx *= -1;
        if(p.y<0 || p.y>canvas.height) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', initParticles);
    initParticles(); animate();
  </script>
