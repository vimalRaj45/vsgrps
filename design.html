<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSGRPS • Real Satellite Earth Splash Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617;
      color: #F1F5F9;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Fullscreen Splash Screen */
    #splash-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 24px 44px;
      z-index: 100;
      background: radial-gradient(circle at 50% 50%, #081636 0%, #020617 75%);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #splash-container.exit-anim {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    /* Three.js Canvas Container */
    #globe-canvas-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Premium Glassmorphic Center Card */
    .glass-center-card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0;
      max-width: 520px;
      width: 90%;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      box-shadow: none !important;
      animation: glassCardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes glassCardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Glass Badge */
    .glass-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(59, 130, 246, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #93C5FD;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.2);
      margin-bottom: 16px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00F0FF;
      box-shadow: 0 0 10px #00F0FF;
      animation: pulseAnim 2s infinite;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .brand-title {
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFFFFF 30%, #93C5FD 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94A3B8;
      margin-bottom: 24px;
    }

    /* Glass Progress Bar */
    .loader-wrap {
      width: 100%;
      margin-bottom: 16px;
    }
    .loader-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }
    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563EB, #00F0FF);
      box-shadow: 0 0 16px #00F0FF;
      transition: width 0.06s linear;
      border-radius: 100px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 11px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 0.08em;
      font-family: 'Space Grotesk', sans-serif;
      margin-top: 8px;
    }

    .btn-enter {
      background: rgba(37, 99, 235, 0.2);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93C5FD;
      padding: 10px 26px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
    }
    .btn-enter:hover {
      background: #3B82F6;
      color: #FFFFFF;
      border-color: #3B82F6;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
      transform: translateY(-2px);
    }

    /* Style Switcher Controls */
    .controls-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      padding: 6px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .control-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .control-btn.active {
      background: #3B82F6;
      color: #FFFFFF;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }

    /* Replay Button */
    .replay-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 200;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #E2E8F0;
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .replay-btn:hover {
      border-color: #3B82F6;
      color: #60A5FA;
    }

    /* Main Website Reveal Simulator */
    .website-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>

  <!-- Controls Panel to test styles -->
  <div class="controls-panel">
    <button class="control-btn active" onclick="setGlobeMode('satellite')">1. NASA Satellite Night Earth</button>
    <button class="control-btn" onclick="setGlobeMode('blue-marble')">2. Blue Marble Day Earth</button>
  </div>

  <!-- Replay Button -->
  <button class="replay-btn" onclick="replaySplash()">
    <i class="bi bi-arrow-counterclockwise"></i> Replay Splash
  </button>

  <!-- Main Website Mock (Behind Splash) -->
  <div class="website-preview">
    <h2 style="font-size:32px;font-weight:700;margin-bottom:12px;color:#FFFFFF;">Welcome to VSGRPS Technologies</h2>
    <p style="color:#94A3B8;max-width:500px;margin-bottom:24px;">The real-world NASA satellite Earth splash screen dissolved seamlessly into your main website experience.</p>
    <a href="index.html" style="color:#3B82F6;text-decoration:none;font-weight:600;"><i class="bi bi-arrow-left"></i> Return to Main Index</a>
  </div>

  <!-- Fullscreen Splash Screen -->
  <div id="splash-container">
    <div id="globe-canvas-wrap"></div>

    <div></div> <!-- Top spacer -->

    <!-- Glassmorphic Center Floating Card -->
    <div class="glass-center-card">
      <div class="glass-badge">
        <span class="pulse-dot"></span> GLOBAL INTELLIGENCE NETWORK
      </div>
      <h1 class="brand-title">VSGRPS</h1>
      <p class="brand-subtitle">Engineering Digital Transformation</p>

      <div class="loader-wrap">
        <div class="loader-track">
          <div class="loader-bar" id="loader-fill"></div>
        </div>
        <div class="status-row">
          <span id="status-text">INITIALIZING GLOBAL MESH...</span>
          <span id="percent-text">0%</span>
        </div>
      </div>

      <button class="btn-enter" onclick="dismissSplash()">
        Enter Studio <i class="bi bi-arrow-right"></i>
      </button>
    </div>

    <div></div> <!-- Bottom spacer -->
  </div>

  <script>
    // ---- Three.js Photorealistic Satellite Earth Engine ----
    let scene, camera, renderer, globeGroup, animId;
    let currentMode = 'satellite';
    const container = document.getElementById('globe-canvas-wrap');

    const textureLoader = new THREE.TextureLoader();

    // High-Res Satellite Earth Textures
    const textures = {
      night: 'https://cdn.jsdelivr.net/gh/vasturiano/three-globe/example/img/earth-night.jpg',
      day: 'https://cdn.jsdelivr.net/gh/vasturiano/three-globe/example/img/earth-blue-marble.jpg',
      bump: 'https://cdn.jsdelivr.net/gh/vasturiano/three-globe/example/img/earth-topology.png'
    };

    function latLongToVector3(lat, lon, radius, alt = 0) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const r = radius + alt;
      return new THREE.Vector3(
        -r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
    }

    const hubs = [
      { name: "India HQ", lat: 11.45, lon: 78.17 },
      { name: "Singapore", lat: 1.35, lon: 103.82 },
      { name: "Dubai", lat: 25.20, lon: 55.27 },
      { name: "London", lat: 51.50, lon: -0.12 },
      { name: "New York", lat: 40.71, lon: -74.00 },
      { name: "San Francisco", lat: 37.77, lon: -122.41 },
      { name: "Tokyo", lat: 35.67, lon: 139.65 },
      { name: "Sydney", lat: -33.86, lon: 151.20 }
    ];

    function initGlobe() {
      if (!container) return;
      container.innerHTML = '';

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 245;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      globeGroup = new THREE.Group();
      scene.add(globeGroup);

      buildGlobe(currentMode);
      animate();
    }

    function buildGlobe(mode) {
      while (globeGroup.children.length > 0) {
        const obj = globeGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
        globeGroup.remove(obj);
      }

      const radius = 72;
      const mapUrl = mode === 'satellite' ? textures.night : textures.day;

      // Real Satellite Earth Sphere
      const earthGeo = new THREE.SphereGeometry(radius, 64, 64);
      const earthMap = textureLoader.load(mapUrl);
      
      const earthMat = new THREE.MeshPhongMaterial({
        map: earthMap,
        specular: 0x3b82f6,
        shininess: 12,
        emissive: mode === 'satellite' ? 0x051535 : 0x000000,
        emissiveIntensity: 0.4
      });
      const earthMesh = new THREE.Mesh(earthGeo, earthMat);
      globeGroup.add(earthMesh);

      // Atmospheric Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      globeGroup.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.8);
      dirLight.position.set(120, 60, 150);
      globeGroup.add(dirLight);

      // Outer Glowing Atmosphere Halo
      const atmosGeo = new THREE.SphereGeometry(radius * 1.04, 32, 32);
      const atmosMat = new THREE.MeshBasicMaterial({
        color: 0x00d2ff,
        transparent: true,
        opacity: 0.18,
        side: THREE.BackSide
      });
      globeGroup.add(new THREE.Mesh(atmosGeo, atmosMat));

      // Global Tech Hubs & Glowing Radar Beacons
      hubs.forEach(hub => {
        const pos = latLongToVector3(hub.lat, hub.lon, radius, 0.6);
        
        // Node dot
        const nodeGeo = new THREE.SphereGeometry(1.3, 16, 16);
        const nodeMat = new THREE.MeshBasicMaterial({ color: 0x00F0FF });
        const nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);
        nodeMesh.position.copy(pos);
        globeGroup.add(nodeMesh);

        // Pulsing Ring
        const ringGeo = new THREE.RingGeometry(1.6, 2.3, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x60A5FA, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.copy(pos);
        ringMesh.lookAt(0, 0, 0);
        globeGroup.add(ringMesh);
      });

      // Photorealistic Tech Hub Curved Flight Arcs
      const connections = [
        [0, 1], // India -> Singapore
        [0, 2], // India -> Dubai
        [2, 3], // Dubai -> London
        [3, 4], // London -> NY
        [4, 5], // NY -> San Francisco
        [5, 6], // SF -> Tokyo
        [1, 7]  // Singapore -> Sydney
      ];

      connections.forEach(([startIdx, endIdx]) => {
        const p1 = latLongToVector3(hubs[startIdx].lat, hubs[startIdx].lon, radius);
        const p2 = latLongToVector3(hubs[endIdx].lat, hubs[endIdx].lon, radius);

        const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
        const dist = p1.distanceTo(p2);
        mid.normalize().multiplyScalar(radius + dist * 0.28);

        const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
        const points = curve.getPoints(40);
        const curveGeo = new THREE.BufferGeometry().setFromPoints(points);
        const curveMat = new THREE.LineBasicMaterial({
          color: 0x00F0FF,
          transparent: true,
          opacity: 0.65,
          linewidth: 2
        });
        const arcLine = new THREE.Line(curveGeo, curveMat);
        globeGroup.add(arcLine);
      });
    }

    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) * 0.0005;
      mouseY = (e.clientY - window.innerHeight / 2) * 0.0005;
    });

    function animate() {
      animId = requestAnimationFrame(animate);

      if (globeGroup) {
        globeGroup.rotation.y += 0.0035;
        globeGroup.rotation.y += mouseX * 0.3;
        globeGroup.rotation.x += mouseY * 0.3;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    function setGlobeMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      buildGlobe(mode);
    }

    // ---- Progress Loader Simulation ----
    let progress = 0;
    const loaderFill = document.getElementById('loader-fill');
    const percentText = document.getElementById('percent-text');
    const statusText = document.getElementById('status-text');
    const statusList = [
      'CONNECTING TO SATELLITE MESH...',
      'SYNCING GLOBAL NODES...',
      'CONFIGURING ARCHITECTURE...',
      'SYSTEM READY'
    ];

    let interval = setInterval(() => {
      progress += 4;
      if (progress > 100) progress = 100;

      if (loaderFill) loaderFill.style.width = progress + '%';
      if (percentText) percentText.textContent = progress + '%';

      if (statusText) {
        if (progress < 30) statusText.textContent = statusList[0];
        else if (progress < 60) statusText.textContent = statusList[1];
        else if (progress < 90) statusText.textContent = statusList[2];
        else statusText.textContent = statusList[3];
      }

      if (progress >= 100) clearInterval(interval);
    }, 40);

    function dismissSplash() {
      const splash = document.getElementById('splash-container');
      if (splash) splash.classList.add('exit-anim');
    }

    function replaySplash() {
      const splash = document.getElementById('splash-container');
      if (splash) {
        splash.classList.remove('exit-anim');
        progress = 0;
        clearInterval(interval);
        interval = setInterval(() => {
          progress += 4;
          if (progress > 100) progress = 100;

          if (loaderFill) loaderFill.style.width = progress + '%';
          if (percentText) percentText.textContent = progress + '%';

          if (statusText) {
            if (progress < 30) statusText.textContent = statusList[0];
            else if (progress < 60) statusText.textContent = statusList[1];
            else if (progress < 90) statusText.textContent = statusList[2];
            else statusText.textContent = statusList[3];
          }

          if (progress >= 100) clearInterval(interval);
        }, 40);
      }
    }

    // Init on load
    window.addEventListener('load', initGlobe);
  </script>
</body>
</html>
