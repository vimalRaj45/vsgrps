<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSGRPS • Cloudflare-Style Cyber Globe Splash Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030712;
      color: #F1F5F9;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Fullscreen Splash Screen */
    #splash-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 24px 40px;
      z-index: 100;
      background: radial-gradient(circle at 50% 50%, #081636 0%, #020617 80%);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #splash-container.exit-anim {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    /* Three.js Canvas Container */
    #globe-canvas-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Top Live Telemetry Bar (Cloudflare Style) */
    .top-telemetry {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748B;
      animation: fadeInDown 0.8s ease forwards;
    }
    .telemetry-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 100px;
      padding: 5px 14px;
      color: #93C5FD;
      letter-spacing: 0.08em;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00F0FF;
      box-shadow: 0 0 10px #00F0FF;
      animation: pulseAnim 1.5s infinite;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Floating Center Content (Zero Box Container) */
    .floating-center-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: none;
    }
    .brand-title {
      font-size: clamp(38px, 6vw, 64px);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFFFFF 40%, #60A5FA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 50px rgba(59, 130, 246, 0.5);
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(11px, 2vw, 13px);
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #94A3B8;
    }

    /* Footer Progress Track (Cloudflare Radar Style) */
    .splash-footer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeInUp 0.8s ease forwards;
    }
    .loader-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      overflow: hidden;
    }
    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3B82F6, #00F0FF);
      box-shadow: 0 0 16px #00F0FF;
      transition: width 0.05s linear;
      border-radius: 100px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 11px;
      font-weight: 600;
      color: #64748B;
      letter-spacing: 0.08em;
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-enter {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93C5FD;
      padding: 9px 24px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      margin-top: 4px;
      font-family: 'Space Grotesk', sans-serif;
    }
    .btn-enter:hover {
      background: #3B82F6;
      color: #FFFFFF;
      border-color: #3B82F6;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
      transform: translateY(-2px);
    }

    /* Style Switcher Controls */
    .controls-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      padding: 6px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .control-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .control-btn.active {
      background: #3B82F6;
      color: #FFFFFF;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }

    /* Replay Button */
    .replay-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 200;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #E2E8F0;
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .replay-btn:hover {
      border-color: #3B82F6;
      color: #60A5FA;
    }

    /* Main Website Reveal Simulator */
    .website-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 24px;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Controls Panel to test styles -->
  <div class="controls-panel">
    <button class="control-btn active" onclick="setGlobeMode('cloudflare')">1. Cloudflare Dotted Radar</button>
    <button class="control-btn" onclick="setGlobeMode('github')">2. GitHub / Stripe Cyber Core</button>
  </div>

  <!-- Replay Button -->
  <button class="replay-btn" onclick="replaySplash()">
    <i class="bi bi-arrow-counterclockwise"></i> Replay Splash
  </button>

  <!-- Main Website Mock (Behind Splash) -->
  <div class="website-preview">
    <h2 style="font-size:32px;font-weight:700;margin-bottom:12px;color:#FFFFFF;">Welcome to VSGRPS Technologies</h2>
    <p style="color:#94A3B8;max-width:500px;margin-bottom:24px;">The Cloudflare-style Cyber Globe dissolved seamlessly into your main website experience.</p>
    <a href="index.html" style="color:#3B82F6;text-decoration:none;font-weight:600;"><i class="bi bi-arrow-left"></i> Return to Main Index</a>
  </div>

  <!-- Fullscreen Splash Screen -->
  <div id="splash-container">
    <div id="globe-canvas-wrap"></div>

    <!-- Top Telemetry Tag -->
    <div class="top-telemetry">
      <div class="telemetry-tag">
        <span class="pulse-dot"></span> GLOBAL INTELLIGENCE NETWORK
      </div>
      <span class="hidden md:inline" style="opacity:0.7;">LATENCY: &lt;18ms</span>
    </div>

    <!-- Floating Center Content (Zero Box) -->
    <div class="floating-center-content">
      <h1 class="brand-title">VSGRPS</h1>
      <p class="brand-subtitle">Engineering Digital Transformation</p>
    </div>

    <!-- Footer Progress & Action -->
    <div class="splash-footer">
      <div class="loader-track">
        <div class="loader-bar" id="loader-fill"></div>
      </div>
      <div class="status-row">
        <span id="status-text">INITIALIZING GLOBAL MESH...</span>
        <span id="percent-text">0%</span>
      </div>
      <button class="btn-enter" onclick="dismissSplash()">
        Enter Studio <i class="bi bi-arrow-right"></i>
      </button>
    </div>
  </div>

  <script>
    // ---- Three.js Cloudflare Radar & Dotted Earth Engine ----
    let scene, camera, renderer, globeGroup, animId, arcGroup, spikesGroup;
    let currentMode = 'cloudflare';
    const container = document.getElementById('globe-canvas-wrap');

    function latLongToVector3(lat, lon, radius, alt = 0) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const r = radius + alt;
      return new THREE.Vector3(
        -r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
    }

    // Cloudflare Radar Tech Hub Data Centers
    const techCenters = [
      { name: "India HQ", lat: 11.45, lon: 78.17, height: 18 },
      { name: "Singapore", lat: 1.35, lon: 103.82, height: 14 },
      { name: "Dubai", lat: 25.20, lon: 55.27, height: 12 },
      { name: "London", lat: 51.50, lon: -0.12, height: 16 },
      { name: "Frankfurt", lat: 50.11, lon: 8.68, height: 14 },
      { name: "New York", lat: 40.71, lon: -74.00, height: 18 },
      { name: "San Francisco", lat: 37.77, lon: -122.41, height: 20 },
      { name: "Tokyo", lat: 35.67, lon: 139.65, height: 15 },
      { name: "Sydney", lat: -33.86, lon: 151.20, height: 12 }
    ];

    function initGlobe() {
      if (!container) return;
      container.innerHTML = '';

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 245;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      globeGroup = new THREE.Group();
      scene.add(globeGroup);

      buildCloudflareGlobe(currentMode);
      animate();
    }

    function buildCloudflareGlobe(mode) {
      while (globeGroup.children.length > 0) {
        const obj = globeGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
        globeGroup.remove(obj);
      }

      const radius = 72;

      // 1. Dark Core Sphere
      const sphereGeo = new THREE.SphereGeometry(radius * 0.99, 48, 48);
      const sphereMat = new THREE.MeshBasicMaterial({
        color: 0x050c1e,
        transparent: true,
        opacity: 0.85
      });
      globeGroup.add(new THREE.Mesh(sphereGeo, sphereMat));

      // 2. High-Density Dotted Matrix Grid (1,800 Fibonacci points)
      const dotCount = 1800;
      const dotGeo = new THREE.BufferGeometry();
      const dotPos = new Float32Array(dotCount * 3);

      for (let i = 0; i < dotCount; i++) {
        const theta = Math.acos(2 * (i / dotCount) - 1);
        const phi = Math.PI * (1 + Math.sqrt(5)) * i;

        dotPos[i * 3] = radius * Math.sin(theta) * Math.cos(phi);
        dotPos[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
        dotPos[i * 3 + 2] = radius * Math.cos(theta);
      }
      dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));

      const dotMat = new THREE.PointsMaterial({
        color: 0x3B82F6,
        size: 1.8,
        transparent: true,
        opacity: 0.75
      });
      globeGroup.add(new THREE.Points(dotGeo, dotMat));

      // 3. Glowing Atmosphere Halo
      const atmosGeo = new THREE.SphereGeometry(radius * 1.05, 32, 32);
      const atmosMat = new THREE.MeshBasicMaterial({
        color: 0x00F0FF,
        transparent: true,
        opacity: 0.16,
        side: THREE.BackSide
      });
      globeGroup.add(new THREE.Mesh(atmosGeo, atmosMat));

      // 4. Cloudflare Data Center City Vertical Light Spikes
      techCenters.forEach(dc => {
        const basePos = latLongToVector3(dc.lat, dc.lon, radius);
        const tipPos = latLongToVector3(dc.lat, dc.lon, radius + dc.height);

        // Vertical laser line
        const lineGeo = new THREE.BufferGeometry().setFromPoints([basePos, tipPos]);
        const lineMat = new THREE.LineBasicMaterial({
          color: 0x00F0FF,
          transparent: true,
          opacity: 0.85,
          linewidth: 2
        });
        globeGroup.add(new THREE.Line(lineGeo, lineMat));

        // Tip glowing head
        const tipGeo = new THREE.SphereGeometry(1.2, 12, 12);
        const tipMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
        const tipMesh = new THREE.Mesh(tipGeo, tipMat);
        tipMesh.position.copy(tipPos);
        globeGroup.add(tipMesh);

        // Ground Radar Ring
        const ringGeo = new THREE.RingGeometry(1.6, 2.4, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x3B82F6, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.copy(basePos);
        ringMesh.lookAt(0, 0, 0);
        globeGroup.add(ringMesh);
      });

      // 5. High-Speed Pulsing Traffic Arcs (Cloudflare Network Routing)
      const connections = [
        [0, 1], // India -> Singapore
        [0, 2], // India -> Dubai
        [2, 3], // Dubai -> London
        [3, 4], // London -> Frankfurt
        [3, 5], // London -> NY
        [5, 6], // NY -> San Francisco
        [6, 7], // SF -> Tokyo
        [1, 8]  // Singapore -> Sydney
      ];

      connections.forEach(([startIdx, endIdx]) => {
        const p1 = latLongToVector3(techCenters[startIdx].lat, techCenters[startIdx].lon, radius);
        const p2 = latLongToVector3(techCenters[endIdx].lat, techCenters[endIdx].lon, radius);

        const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
        const dist = p1.distanceTo(p2);
        mid.normalize().multiplyScalar(radius + dist * 0.32);

        const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
        const points = curve.getPoints(50);
        const curveGeo = new THREE.BufferGeometry().setFromPoints(points);
        const curveMat = new THREE.LineBasicMaterial({
          color: 0x00F0FF,
          transparent: true,
          opacity: 0.7,
          linewidth: 2
        });
        const arcLine = new THREE.Line(curveGeo, curveMat);
        globeGroup.add(arcLine);
      });

      // 6. Orbital Satellite Ring
      const orbitRingGeo = new THREE.RingGeometry(radius * 1.35, radius * 1.38, 64);
      const orbitRingMat = new THREE.MeshBasicMaterial({
        color: 0x3B82F6,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.35
      });
      const orbitRing = new THREE.Mesh(orbitRingGeo, orbitRingMat);
      orbitRing.rotation.x = Math.PI / 3.5;
      globeGroup.add(orbitRing);
    }

    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) * 0.0005;
      mouseY = (e.clientY - window.innerHeight / 2) * 0.0005;
    });

    function animate() {
      animId = requestAnimationFrame(animate);

      if (globeGroup) {
        globeGroup.rotation.y += 0.004;
        globeGroup.rotation.y += mouseX * 0.3;
        globeGroup.rotation.x += mouseY * 0.3;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    function setGlobeMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      buildCloudflareGlobe(mode);
    }

    // ---- Progress Loader Simulation ----
    let progress = 0;
    const loaderFill = document.getElementById('loader-fill');
    const percentText = document.getElementById('percent-text');
    const statusText = document.getElementById('status-text');
    const statusList = [
      'ROUTING TO CLOUDFLARE EDGE...',
      'ESTABLISHING ENCRYPTED TUNNEL...',
      'CALCULATING OPTIMAL LATENCY...',
      'EDGE ACTIVE • 310+ NODES'
    ];

    let interval = setInterval(() => {
      progress += 4;
      if (progress > 100) progress = 100;

      if (loaderFill) loaderFill.style.width = progress + '%';
      if (percentText) percentText.textContent = progress + '%';

      if (statusText) {
        if (progress < 30) statusText.textContent = statusList[0];
        else if (progress < 60) statusText.textContent = statusList[1];
        else if (progress < 90) statusText.textContent = statusList[2];
        else statusText.textContent = statusList[3];
      }

      if (progress >= 100) clearInterval(interval);
    }, 40);

    function dismissSplash() {
      const splash = document.getElementById('splash-container');
      if (splash) splash.classList.add('exit-anim');
    }

    function replaySplash() {
      const splash = document.getElementById('splash-container');
      if (splash) {
        splash.classList.remove('exit-anim');
        progress = 0;
        clearInterval(interval);
        interval = setInterval(() => {
          progress += 4;
          if (progress > 100) progress = 100;

          if (loaderFill) loaderFill.style.width = progress + '%';
          if (percentText) percentText.textContent = progress + '%';

          if (statusText) {
            if (progress < 30) statusText.textContent = statusList[0];
            else if (progress < 60) statusText.textContent = statusList[1];
            else if (progress < 90) statusText.textContent = statusList[2];
            else statusText.textContent = statusList[3];
          }

          if (progress >= 100) clearInterval(interval);
        }, 40);
      }
    }

    // Init on load
    window.addEventListener('load', initGlobe);
  </script>
</body>
</html>
